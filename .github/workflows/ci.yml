name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mercadozap
          POSTGRES_PASSWORD: mercadozap
          POSTGRES_DB: mercadozap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mercadozap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://mercadozap:mercadozap@localhost:5432/mercadozap
      REDIS_URL: redis://localhost:6379
      ABACATEPAY_KEY: ci-dummy-key
      ABACATEPAY_WEBHOOK_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build

  flutter:
    name: Flutter (analyze, informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.3
          channel: stable
      - run: flutter pub get
      # Non-blocking for now: the app still carries legacy lint issues.
      - run: flutter analyze
        continue-on-error: true
