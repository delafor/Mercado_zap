# Local infrastructure and optional full stack.
#
#   docker compose up -d                 -> Postgres + Redis only.
#                                           Run the API on the host with `npm run dev` (hot reload).
#   docker compose --profile full up -d  -> also builds and runs the API,
#                                           applying migrations on startup.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mercadozap
      POSTGRES_PASSWORD: mercadozap
      POSTGRES_DB: mercadozap
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mercadozap']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    profiles: ['full']
    env_file: .env
    environment:
      # Override the infra URLs to use the compose network hostnames.
      DATABASE_URL: postgres://mercadozap:mercadozap@postgres:5432/mercadozap
      REDIS_URL: redis://redis:6379
    command: sh -c "node dist/db/migrate.js && node dist/server.js"
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
